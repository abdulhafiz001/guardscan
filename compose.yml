services:
  # Web GUI Dashboard Service (Primary Coolify Production Service)
  guardscan-web:
    image: guardscan:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardscan-web
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - guardscan-reports:/app/reports
      - guardscan-output:/app/output
      - ./payloads:/app/payloads:ro
    environment:
      - DISPLAY=:99
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - MODE=web
      - HOST=0.0.0.0
      - PORT=${PORT:-5000}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=${DEBUG:-false}
    # Shared memory size for headless Chrome browser automation
    shm_size: '2gb'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 1G
    networks:
      - guardscan_net
    healthcheck:
      test: ["CMD-SHELL", "python3 /app/scripts/healthcheck.py || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  # CLI Mode Service (Interactive Scanner & DevSecOps Runner)
  guardscan-cli:
    image: guardscan:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardscan-cli
    profiles:
      - cli
      - tools
    stdin_open: true
    tty: true
    volumes:
      - guardscan-reports:/app/reports
      - guardscan-output:/app/output
      - ./payloads:/app/payloads:ro
    environment:
      - DISPLAY=:99
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - MODE=cli
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 1G
    networks:
      - guardscan_net

volumes:
  guardscan-reports:
    name: guardscan-reports
  guardscan-output:
    name: guardscan-output

networks:
  guardscan_net:
    name: guardscan_net
    driver: bridge
